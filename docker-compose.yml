# sanjasmart no infra-ia-2. Estado no .195 via WireGuard.
services:
  app:
    image: ferramenta-sanjasmart-app:latest
    container_name: sanjasmart_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '10.88.0.2:8111:8111'
    volumes:
      - ./prompt-cliente.txt:/app/prompt-cliente.txt:ro
      - ./data:/app/data:ro
      - ./data/crm-arquivos:/app/data/crm-arquivos
      - ./app/dist:/app/dist:ro
      - ./app/public/crm:/app/public/crm:ro
      - ./app/public/dashboard:/app/public/dashboard:ro
      - ./app/public/js:/app/public/js:ro
      - ./app/public/phone.html:/app/public/phone.html:ro
      - ./app/public/tema-sanja.css:/app/public/tema-sanja.css:ro
      - ./app/public/path-base.js:/app/public/path-base.js:ro
      - ./app/public/prompt-markup.js:/app/public/prompt-markup.js:ro
      - ./app/public/prompt-editor-ux.js:/app/public/prompt-editor-ux.js:ro
      - ./app/public/midias-gatilho.js:/app/public/midias-gatilho.js:ro
      - ./app/public/midias-gatilho.css:/app/public/midias-gatilho.css:ro
      - ./data/midias-gatilho:/app/data/midias-gatilho
      - ./.env:/app/.env:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||'8111')+'/health/live',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
