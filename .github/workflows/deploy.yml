# Deploy automático SanjaWorks — push em main sobe o container do cliente.
# PR só valida o build (não sobe produção).
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# Pasta no servidor: /root/{slug}-rag/ferramenta-{slug}
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose.yml'
      - 'prompt-cliente.txt'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose.yml'
      - 'prompt-cliente.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem (validação)
        run: docker build -t pr-check-${{ github.event.repository.name }} ./app

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            REPO="${{ github.event.repository.name }}"
            SLUG="${REPO#ferramenta-}"
            DIR="/root/${SLUG}-rag/ferramenta-${SLUG}"
            if [ ! -d "$DIR" ]; then
              echo "ERRO: pasta nao encontrada: $DIR"
              exit 1
            fi
            cd "$DIR"
            if [ ! -d .git ]; then
              echo "ERRO: sem .git em $DIR — configure o remote antes"
              exit 1
            fi
            git remote get-url origin >/dev/null
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            docker compose up -d --build app
            docker compose ps app
            echo "Deploy OK: $SLUG"
