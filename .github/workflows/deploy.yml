# Validação de PR SanjaWorks — deploy é feito manualmente no servidor.
name: PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose.yml'
      - 'prompt-cliente.txt'
      - '.github/workflows/deploy.yml'

concurrency:
  group: pr-check-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem (validação)
        # tag fixa: o nome do repositório pode terminar em hífen, o que o Docker recusa
        run: docker build -t pr-check ./app
